name: API coverage

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read   # checkout only — the workflow commits nothing
  issues: write    # upsert the watch issue

concurrency:
  group: api-coverage
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - id: check
        name: Build the watch-issue body (read-only — diff + pending + stale)
        run: python scripts/run_coverage_check.py

      # Only touch the issue when there's something to surface (no empty issue).
      - name: Upsert the watch issue (digest no-op so quiet weeks don't notify)
        if: steps.check.outputs.surface == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Rossum API coverage — watch"
          newd=$(grep -m1 'coverage-digest:' issue-body.md | sed -E 's/.*coverage-digest: *([a-f0-9]+).*/\1/')
          num=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
                -q ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$num" ]; then
            oldd=$(gh issue view "$num" --json body -q .body \
                   | grep -m1 'coverage-digest:' | sed -E 's/.*coverage-digest: *([a-f0-9]+).*/\1/')
            if [ "$oldd" = "$newd" ]; then
              echo "digest unchanged ($newd) — no-op"
            else
              gh issue edit "$num" --title "$TITLE" --body-file issue-body.md
              echo "updated issue #$num"
            fi
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
