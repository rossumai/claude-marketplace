name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = documented hook/runtime target; 3.14 = what contributors run.
        python-version: ["3.12", "3.14"]
    steps:
      # Pinned to commit SHAs (mutable tags can be repointed). Dependabot bumps these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (real errors only)
        run: ruff check .
      - name: Tests + guards
        run: pytest

  # The MCP server's floor: Cowork's Linux VM starts it with its own python3 (3.10),
  # whatever the user's Mac has. Only the server suite runs here; skill scripts target 3.12.
  mcp-server-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - run: pip install pytest pyyaml
      - name: Server starts on 3.10
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | python plugins/rossum-sa/mcp-servers/rossum-api/server.py | grep -q '"serverInfo"'
      - name: Server tests on 3.10
        run: pytest tests/test_server_helpers.py tests/test_runtime_contract.py
